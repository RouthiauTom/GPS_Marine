<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Marine GPS V0.5</title>

  <link
    href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./css/app.css">
</head>

<body>
  <div id="map"></div>

  <div class="panel">
    <div class="title">⚓ Marine GPS — V0.5</div>

    <div class="data">
      <div><span class="label">Latitude</span><br><span id="lat">—</span></div>
      <div><span class="label">Longitude</span><br><span id="lon">—</span></div>
      <div><span class="label">SOG</span><br><span id="speed">—</span></div>
      <div><span class="label">COG</span><br><span id="course">—</span></div>
      <div><span class="label">Précision</span><br><span id="accuracy">—</span></div>
    </div>

    <div id="status">GPS : attente d'autorisation…</div>
    <button id="locate">📍 Recentrer sur le bateau</button>
    <div id="track-status" aria-live="polite">Trace arrêtée</div>
    <div class="track-actions">
      <button id="track-start" disabled>Démarrer</button>
      <button id="track-stop" disabled>Arrêter</button>
      <button id="track-clear" disabled>Effacer</button>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
