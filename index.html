<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Marine GPS V0.2</title>

  <link
    href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"
    rel="stylesheet"
  />

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background: #111;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .panel {
      position: fixed;
      z-index: 10;
      left: 12px;
      right: 12px;
      top: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(20, 25, 30, .88);
      color: white;
      backdrop-filter: blur(8px);
      box-shadow: 0 3px 18px rgba(0,0,0,.25);
    }

    .title {
      font-weight: 700;
      margin-bottom: 8px;
    }

    .data {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px 18px;
      font-size: 14px;
    }

    .label { color: #aeb8c2; }

    #status {
      margin-top: 9px;
      font-size: 13px;
      color: #ffd166;
    }

    button {
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      padding: 9px 12px;
      background: white;
      color: #111;
      font-weight: 650;
    }

    .boat {
      width: 0;
      height: 0;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-bottom: 30px solid #e63946;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.45));
    }

    .maplibregl-ctrl-attrib {
      font-size: 10px !important;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="panel">
    <div class="title">⚓ Marine GPS — V0.2</div>

    <div class="data">
      <div><span class="label">Latitude</span><br><span id="lat">—</span></div>
      <div><span class="label">Longitude</span><br><span id="lon">—</span></div>
      <div><span class="label">Vitesse</span><br><span id="speed">—</span></div>
      <div><span class="label">Précision</span><br><span id="accuracy">—</span></div>
    </div>

    <div id="status">GPS : attente d'autorisation…</div>
    <button id="locate">📍 Recentrer sur le bateau</button>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

  <script>
    // OpenFreeMap : fond cartographique basé sur OpenStreetMap.
    // Aucun compte ni clé API n'est nécessaire pour ce prototype.
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [-1.7, 49.35],
      zoom: 9,
      attributionControl: true
    });

    map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

    let boatMarker = null;
    let firstFix = true;
    let lastPosition = null;

    const $ = id => document.getElementById(id);

    function createBoatMarker() {
      const el = document.createElement('div');
      el.className = 'boat';
      el.title = 'Position du bateau';

      return new maplibregl.Marker({
        element: el,
        anchor: 'bottom'
      });
    }

    function updateGPS(position) {
      const coords = position.coords;
      const lat = coords.latitude;
      const lon = coords.longitude;

      $('lat').textContent = lat.toFixed(6) + '°';
      $('lon').textContent = lon.toFixed(6) + '°';
      $('accuracy').textContent =
        coords.accuracy ? Math.round(coords.accuracy) + ' m' : '—';

      let speed = coords.speed;

      // Certains téléphones ne donnent pas coords.speed.
      // On estime alors la vitesse entre deux positions.
      if ((speed === null || speed === undefined) && lastPosition) {
        const distance = distanceMeters(
          lastPosition.lat,
          lastPosition.lon,
          lat,
          lon
        );

        const dt = (position.timestamp - lastPosition.time) / 1000;

        if (dt > 0) speed = distance / dt;
      }

      if (speed !== null && speed !== undefined && Number.isFinite(speed)) {
        $('speed').textContent =
          (speed * 1.943844).toFixed(1) + ' nd';
      } else {
        $('speed').textContent = '—';
      }

      lastPosition = {
        lat,
        lon,
        time: position.timestamp
      };

      if (!boatMarker) {
        boatMarker = createBoatMarker();
        boatMarker.setLngLat([lon, lat]).addTo(map);
      } else {
        boatMarker.setLngLat([lon, lat]);
      }

      $('status').textContent = 'GPS : position reçue';

      if (firstFix) {
        map.flyTo({
          center: [lon, lat],
          zoom: 15,
          essential: true
        });
        firstFix = false;
      }
    }

    function gpsError(error) {
      const messages = {
        1: "GPS : autorisation refusée.",
        2: "GPS : position indisponible.",
        3: "GPS : délai dépassé."
      };

      $('status').textContent =
        messages[error.code] || "GPS : erreur inconnue.";
    }

    function distanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const rad = Math.PI / 180;

      const p1 = lat1 * rad;
      const p2 = lat2 * rad;
      const dp = (lat2 - lat1) * rad;
      const dl = (lon2 - lon1) * rad;

      const a =
        Math.sin(dp / 2) ** 2 +
        Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;

      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        updateGPS,
        gpsError,
        {
          enableHighAccuracy: true,
          maximumAge: 2000,
          timeout: 15000
        }
      );
    } else {
      $('status').textContent =
        "Ce navigateur ne fournit pas de géolocalisation.";
    }

    $('locate').addEventListener('click', () => {
      if (boatMarker) {
        map.flyTo({
          center: boatMarker.getLngLat(),
          zoom: Math.max(map.getZoom(), 15),
          essential: true
        });
      }
    });
  </script>
</body>
</html>
